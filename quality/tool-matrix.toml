# Tool matrix: every gate, guard, and quality tool this repository runs, with its
# version, checksum, rules, conflicts, exceptions, runtime, findings, and the date
# its releases, advisories, and rules were last checked. scripts/check-tool-matrix.sh
# enforces it (see its header); the Tool matrix workflow runs that check.
#
# Runtimes come from GitHub Actions step timings since 2026-09-19 on ubuntu-24.04.
# Every run starts from an empty runner. p99 needs 100 runs; below that an entry
# gives the run count and the maximum.
# Format: one `key = value` per line, arrays on one line, pins as "file::text"
# where @VERSION@ stands for the entry's version. `uses` lists actions by name; the
# workflows hold each pin (a full commit and a version comment).
#
# Open gap: no gate checks links, MDX syntax, or spelling in the pages; the site
# build checks them only after merge.

gates = []
utilities = []

[[tool]]
id = "locales-check"
risk = "a translated page that is missing, extra, or out of step with its English page"
tool = "scripts/check_locales.py"
version = "repository"
unpinned = "repository script, versioned by commit; runs on the runner image's Python 3"
commands = ["scripts/check_locales.py"]
runs_in = "Locales workflow on every pull request and push to main"
config = "the script; English pages are the reference"
conflicts = "none known"
exceptions = "none"
runtime = "push n=18, max 1 s; pull request n=19, max 1 s; p99 unsupported"
findings = "unknown: no recorded finding"
replaces = "none"
checked = 2026-11-19

[[tool]]
id = "indexnow"
risk = "search engines that learn about new, changed, or removed docs pages late or never"
tool = "scripts/indexnow.py"
version = "repository"
unpinned = "repository script, versioned by commit; runs on the runner image's Python 3"
commands = ["scripts/indexnow.py", "scripts/test-indexnow.py"]
runs_in = "IndexNow workflow: the tests on every pull request and push to main; the ping after each successful deployment of main"
config = "the script; the key file <key>.json at the repository root"
conflicts = "none known"
exceptions = "a failed ping warns in the job summary and never fails the run"
runtime = "the last 15 runs: tests n=10, max 12 s; ping n=5, max 11 s; p99 unsupported"
findings = "2026-11-25: all 28 pings after a deployment passed; 12 sent the changed pages (HTTP 200) and 13 found no changed page; 1 pull request run failed on 2026-11-01, before the first merge"
replaces = "none"
checked = 2026-11-25

[[tool]]
id = "brand-assets-check"
risk = "logos, fonts, or colors that drift from the canonical brand assets"
tool = "scripts/check_brand_assets.py"
version = "repository"
unpinned = "repository script, versioned by commit; runs on the runner image's Python 3"
commands = ["scripts/check_brand_assets.py"]
runs_in = "Brand assets workflow on every pull request and push to main"
config = "brand-assets.json"
conflicts = "none known"
exceptions = "none"
runtime = "push n=47, max 1 s; pull request n=54, max 1 s; p99 unsupported"
findings = "unknown: no recorded finding"
replaces = "none"
checked = 2026-11-19

[[tool]]
id = "public-guard"
risk = "secrets or non-public text in commits, paths, branch names, and pull request text; tracked Markdown that users do not need"
tool = "gitleaks with the public guard rules"
version = "8.30.1"
pins = ["scripts/public-guard.sh::readonly gitleaks_version=\"@VERSION@\"", "scripts/public-guard.sh::e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080", "scripts/public-guard.sh::551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"]
commands = ["scripts/public-guard.sh", "scripts/test-public-guard.sh"]
runs_in = "Public guard workflow (required status) on every pull request and push"
config = "scripts/public-guard.toml"
conflicts = "none known"
exceptions = "false positives are fixed in their own pull request"
runtime = "scan n=76, max 6 s; self-test: push n=36, max 30 s; pull request n=43, max 31 s; p99 unsupported"
findings = "unknown: findings are fixed before merge"
replaces = "none"
checked = 2026-11-19

[[tool]]
id = "actions-checkout"
risk = "CI source checkout supply chain"
tool = "actions/checkout"
version = "7.0.1"
unpinned = "each workflow pins the commit with a version comment; Dependabot proposes updates weekly"
uses = ["actions/checkout"]
runs_in = "every workflow"
config = "persist-credentials: false where the job needs no push"
conflicts = "none known"
exceptions = "none"
runtime = "at most 3 s per run"
findings = "not a check; supply-chain pin"
replaces = "none"
checked = 2026-11-19

[[tool]]
id = "tool-matrix"
risk = "a gate tool without an entry, a pin that differs from its entry, an entry not checked for 30 days"
tool = "scripts/check-tool-matrix.sh and its seeded tests"
version = "repository"
unpinned = "repository script, versioned by commit"
commands = ["scripts/check-tool-matrix.sh", "scripts/test-check-tool-matrix.sh"]
runs_in = "Tool matrix workflow on every pull request and push to main"
config = "this file"
conflicts = "reads commands with a small shell reader; a command built at run time is invisible to it"
exceptions = "none"
runtime = "new; record from CI runs at the next check"
findings = "seeded: an unlisted command, a changed pin, a changed action commit, a stale or future date, and a missing field each fail"
replaces = "none"
checked = 2026-11-19

[[tool]]
id = "dependabot-coverage"
risk = "a dependency or tool manifest that Dependabot never updates, or an entry that is not daily, has no 7-day cooldown, or splits updates into many pull requests"
tool = "scripts/check-dependabot.sh and its seeded tests"
version = "repository"
unpinned = "repository script, versioned by commit"
commands = ["scripts/check-dependabot.sh", "scripts/test-check-dependabot.sh"]
runs_in = "Tool matrix workflow on every pull request and push to main"
config = ".github/dependabot.yml"
conflicts = "reads a YAML subset with a small awk reader; a glob in `directories` fails, so every directory is listed"
exceptions = "none"
runtime = "new; record from CI runs at the next check"
findings = "seeded: an unlisted manifest directory, an unlisted Cargo workspace root, a listed directory without a manifest, a glob, a second entry for one ecosystem, a weekly schedule, a missing cooldown, and ungrouped updates each fail"
replaces = "none"
checked = 2026-11-21

[[tool]]
id = "openssf-scorecard"
risk = "Supply chain practices drifting: unpinned actions, write tokens, branch protection, dangerous workflows"
tool = "OpenSSF Scorecard action and the CodeQL SARIF upload"
version = "pinned in the workflows"
unpinned = "the scorecard workflow pins each action to a commit with a version comment; the check requires one such pin per action"
uses = ["ossf/scorecard-action", "github/codeql-action/upload-sarif"]
runs_in = "scorecard workflow: pushes to main, weekly, and branch protection changes"
config = "publish_results: true; results go to the OpenSSF API and to code scanning"
conflicts = "none known"
exceptions = "none"
runtime = "scorecard job, the last 15 successful runs: max 49 s; p99 unsupported"
findings = "2026-11-25: score 7.6 of 10 (Scorecard v5.7.0 on main, 2026-11-25). Fuzzing 0: no fuzz targets. Code-Review 0 and Contributors 0 (one maintainer merges without review); Branch-Protection 4; CII-Best-Practices 0 (no badge); Packaging and Signed-Releases not scored (no packaging workflow, no releases)"
replaces = "none"
checked = 2026-11-25

[[tool]]
id = "zizmor"
risk = "GitHub Actions workflows, actions, and Dependabot settings that an attacker can turn against the repository: template injection, broad token permissions, persisted credentials, dangerous triggers, cache poisoning, and unpinned or known-vulnerable actions"
tool = "zizmor through zizmorcore/zizmor-action"
version = "1.32.0"
unpinned = "the zizmor workflow pins zizmorcore/zizmor-action to a commit with a version comment; that commit's lock file pins zizmor by version and wheel hashes, so a Dependabot update of the action updates zizmor"
uses = ["zizmorcore/zizmor-action"]
runs_in = "zizmor workflow: every pull request and push to main"
config = ".github/zizmor.yml; regular persona with online audits; every finding fails the run"
conflicts = "none known"
exceptions = "dangerous-triggers in public-guard.yml and public-text-guard.yml: the guard needs the term list on fork pull requests and never runs their content; .github/zizmor.yml gives each reason"
runtime = "not yet recorded; the workflow is new"
findings = "2026-11-21 before: 6 (3 dangerous-triggers, 2 dependabot-cooldown, 1 artipacked); after: 0, with the 3 dangerous-triggers ignored; a seeded workflow with template injection and an unpinned action fails the run"
replaces = "none"
checked = 2026-11-21
