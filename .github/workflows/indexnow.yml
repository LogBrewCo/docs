name: IndexNow

# When a new version of docs.logbrew.co is live, tell IndexNow search engines
# (Bing, Yandex, and others) which pages were added, changed, or removed
# (scripts/indexnow.py). The ping never runs on a push: it waits for the
# successful deployment of main. The tests run on every pull request and push.

on:
  deployment_status:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  test:
    name: IndexNow tests
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test page selection, requests, and retries
        run: python3 scripts/test-indexnow.py

  ping:
    name: Send changed pages to IndexNow
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.ref == 'main' &&
      github.event.deployment_status.environment_url == 'https://docs.logbrew.co'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: read
    concurrency:
      group: indexnow
      cancel-in-progress: false
    steps:
      - name: Check out the live version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Send changed pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ github.event.deployment.id }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
        run: python3 scripts/indexnow.py
