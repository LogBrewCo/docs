name: Tool matrix

# Every gate command has a current entry in quality/tool-matrix.toml, and every
# pinned version, checksum, and action matches it (scripts/check-tool-matrix.sh).

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Tool matrix is complete and current
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tool matrix and its seeded failures
        run: bash scripts/check-tool-matrix.sh && bash scripts/test-check-tool-matrix.sh
